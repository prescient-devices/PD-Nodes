<script type="text/x-red" data-template-name="downloadfile">
  <div class="form-row node-input-filename">
       <label for="node-input-filename"><i class="fa fa-file"></i> <span data-i18n="downloadfile.label.filename"></span></label>
       <input id="node-input-filename" type="text">
  </div>
  <div class="form-row">
    <input type="checkbox" id="node-input-stream" style="display: inline-block; width: auto; vertical-align: top;" />
    <label for="node-input-stream" style="width: auto" data-i18n="downloadfile.label.stream"></label>
  </div>
  <div class="form-row form-row-error-property">
    <label for="node-input-errorProperty"><i class="fa fa-exclamation-triangle"></i> <span data-i18n="downloadfile.label.errorProperty"></span></label>
    <input type="text" id="node-input-errorProperty" style="width: 250px;">
  </div>
  <div class="form-row form-row-file-encoding">
      <label for="node-input-encoding"><i class="fa fa-flag"></i> <span data-i18n="downloadfile.label.encoding"></span></label>
      <select type="text" id="node-input-encoding" style="width: 250px;">
      </select>
  </div>
  <div class="form-row node-input-name">
    <label for="node-input-name"><i class="fa fa-tag" style="width: 20px;"></i><span data-i18n="downloadfile.label.name"></span></label>
    <input type="text" id="node-input-name" data-i18n="[placeholder]downloadfile.label.name" style="width: 339.19px;">
  </div>
  <div class="form-row" hidden>
    <input type="number" id="node-input-outputs">
  </div>
</script>

<script type="text/javascript">
  ; (function () {
    let globalEncodings = [
      [
        "downloadfile.encoding.native",
        "utf8",
        "ucs2",
        "utf-16le",
        "ascii",
        "binary",
        "base64",
        "hex",
      ],
      ["downloadfile.encoding.unicode", "utf-16be"],
      [
        "downloadfile.encoding.japanese",
        "Shift_JIS",
        "Windows-31j",
        "Windows932",
        "EUC-JP",
      ],
      [
        "downloadfile.encoding.chinese",
        "GB2312",
        "GBK",
        "GB18030",
        "Windows936",
        "EUC-CN",
      ],
      ["downloadfile.encoding.korean", "KS_C_5601", "Windows949", "EUC-KR"],
      ["downloadfile.encoding.taiwan", "Big5", "Big5-HKSCS", "Windows950"],
      [
        "downloadfile.encoding.windows",
        "cp874",
        "cp1250",
        "cp1251",
        "cp1252",
        "cp1253",
        "cp1254",
        "cp1255",
        "cp1256",
        "cp1257",
        "cp1258",
      ],
      [
        "downloadfile.encoding.iso",
        "ISO-8859-1",
        "ISO-8859-2",
        "ISO-8859-3",
        "ISO-8859-4",
        "ISO-8859-5",
        "ISO-8859-6",
        "ISO-8859-7",
        "ISO-8859-8",
        "ISO-8859-9",
        "ISO-8859-10",
        "ISO-8859-11",
        "ISO-8859-12",
        "ISO-8859-13",
        "ISO-8859-14",
        "ISO-8859-15",
        "ISO-8859-16",
      ],
      [
        "downloadfile.encoding.ibm",
        "cp437",
        "cp737",
        "cp775",
        "cp808",
        "cp850",
        "cp852",
        "cp855",
        "cp856",
        "cp857",
        "cp858",
        "cp860",
        "cp861",
        "cp866",
        "cp869",
        "cp922",
        "cp1046",
        "cp1124",
        "cp1125",
        "cp1129",
        "cp1133",
        "cp1161",
        "cp1162",
        "cp1163",
      ],
      [
        "downloadfile.encoding.mac",
        "maccroatian",
        "maccyrillic",
        "macgreek",
        "maciceland",
        "macroman",
        "macromania",
        "macthai",
        "macturkish",
        "macukraine",
        "maccenteuro",
        "macintosh",
      ],
      ["downloadfile.encoding.koi8", "koi8-r", "koi8-u", "koi8-ru", "koi8-t"],
      [
        "downloadfile.encoding.misc",
        "armscii8",
        "rk1048",
        "tcvn",
        "georgianacademy",
        "georgianps",
        "pt154",
        "viscii",
        "iso646cn",
        "iso646jp",
        "hproman8",
        "tis620",
      ],
    ]
    // ---- Stream mode ---------------------------------------------------------
    // How long the claim POST and the cancel POST are each given before they are
    // abandoned.
    const globalAdminTimeoutMs = 30 * 1000
    // Every banner carries its own expiry. An editor that is offline when the
    // runtime broadcasts the claimed or expired event never learns that the
    // request is over. Matches the ten minutes the runtime waits for a click.
    const globalDownloadExpiryMs = 10 * 60 * 1000
    // Download id -> { node, notification, timer, claiming }. Object.create(null)
    // because the key arrives over the comms channel, and "__proto__" is not a
    // key at all on a plain object.
    const globalDownloads = Object.create(null)
    // A download id and a ticket are each 32 lowercase hex characters. Anything
    // else is dropped before it reaches a URL or is used as a map key.
    const globalHexIdRe = /^[0-9a-f]{32}$/
    // Longest node label or file name shown in a banner.
    const globalLabelMaxLen = 120
    // Arming, claiming and expiry all arrive on this one topic prefix. It must not
    // start with "DOWNLOAD-FILE", the prefix of the one-file-per-message mode.
    const globalStreamSentinel = "notification/STREAM-DOWNLOAD-FILE-"
    // Build a call to this node's own admin routes. The editor attaches admin-API
    // credentials to jQuery requests from a global $.ajaxSetup prefilter; this
    // repeats that contract so the URL is also usable for a navigation.
    function adminRequest(path) {
      const settings = (typeof RED === "object" && RED && RED.settings) || null
      const root = (settings && settings.apiRootUrl) || ""
      const headers = { "Node-RED-API-Version": "v2" }
      let tokens = null
      try {
        // get() reads localStorage, which a browser can refuse.
        tokens = settings && settings.get ? settings.get("auth-tokens") : null
      } catch (_) {}
      if (tokens && tokens.access_token) {
        headers.Authorization = `Bearer ${tokens.access_token}`
      }
      return { url: root + path, headers }
    }
    // Take the file for this browser and then save it. Two steps, because the
    // download itself can be a navigation, and a navigation cannot carry the
    // Authorization header. This POST carries it and passes the permission
    // check, and it answers with a one-time ticket the download route accepts.
    // With a file handle from the save dialog, the file is written there;
    // without one, the browser's download manager saves it.
    function claimDownload(downloadId, handle) {
      const entry = globalDownloads[downloadId]
      if (!entry || entry.claiming) {
        return
      }
      entry.claiming = true
      const node = entry.node
      const request = adminRequest(
        `node-red-contrib-downloadfile/claim/${encodeURIComponent(downloadId)}`
      )
      $.ajax({
        type: "POST",
        url: request.url,
        headers: Object.assign({ Accept: "application/json" }, request.headers),
        dataType: "json",
        timeout: globalAdminTimeoutMs,
        success: function (data) {
          const ticket = (data || {}).ticket
          if (typeof ticket !== "string" || !globalHexIdRe.test(ticket)) {
            entry.claiming = false
            notifyFailure(node, handle, "downloadfile.info.download_failed", "error")
            return
          }
          clearDownload(downloadId, false)
          if (handle) {
            saveToFile(node, handle, ticket)
          } else {
            saveDownload(ticket)
          }
        },
        error: function (jqXHR) {
          if (jqXHR.status === 409) {
            // Somebody else clicked first.
            clearDownload(downloadId, false)
            notifyFailure(node, handle, "downloadfile.info.download_claimed")
            return
          }
          if (jqXHR.status === 404) {
            // The ten minutes ran out and the runtime has dropped the download.
            clearDownload(downloadId, false)
            notifyFailure(node, handle, "downloadfile.info.download_expired")
            return
          }
          // Anything else may work on a second attempt, so the banner stays.
          entry.claiming = false
          notifyFailure(node, handle, "downloadfile.info.download_failed", "error")
        },
      })
    }
    // Take a banner down and stop its expiry timer. When `cancel` is set, tell
    // the runtime that nobody is coming for the file, so it releases the stream.
    function clearDownload(downloadId, cancel) {
      const entry = globalDownloads[downloadId]
      if (!entry) {
        return
      }
      delete globalDownloads[downloadId]
      window.clearTimeout(entry.timer)
      if (entry.notification) {
        entry.notification.close()
      }
      if (!cancel) {
        return
      }
      const request = adminRequest(
        `node-red-contrib-downloadfile/cancel/${encodeURIComponent(downloadId)}`
      )
      $.ajax({
        type: "POST",
        url: request.url,
        headers: Object.assign({ Accept: "application/json" }, request.headers),
        timeout: globalAdminTimeoutMs,
        error: function (jqXHR) {
          if (jqXHR.status === 404 || jqXHR.status === 409) {
            return
          }
          const msg = entry.node._("downloadfile.info.download_cancel_failed")
          RED.notify(notifyText(msg), "error")
        },
      })
    }
    // RED.notify() puts a string argument straight into innerHTML, and a node
    // name or file name inside a catalogue string arrives raw. A text node takes
    // the append branch, which cannot inject markup. Button labels reach
    // innerHTML too, so they may only ever be literal catalogue strings.
    function notifyText(msg) {
      return $("<p>").text(msg)
    }
    // Delete the invisible and direction-altering characters that could make a
    // banner read as something it does not say, and bound the length. The list
    // is the same one sanitizeFilename() in downloadfile-stream_core.js deletes;
    // change both together.
    function safeLabel(arg) {
      const chars = Array.from(stripHidden(arg))
      const text =
        chars.length > globalLabelMaxLen
          ? `${chars.slice(0, globalLabelMaxLen).join("")}...`
          : chars.join("")
      if (!text) {
        return ""
      }
      // A first-strong isolate, so right-to-left text in a name cannot reorder
      // the rest of the sentence.
      return `${String.fromCodePoint(0x2066)}${text}${String.fromCodePoint(0x2069)}`
    }
    // The text with the invisible and direction-altering characters deleted.
    // Used by safeLabel(), and for the name offered in the save dialog.
    function stripHidden(arg) {
      const raw = String(arg === null || arg === undefined ? "" : arg)
      const chars = []
      for (const ch of raw) {
        const code = ch.codePointAt(0)
        if (
          code < 0x20 ||
          (code >= 0x7f && code <= 0x9f) ||
          code === 0x00ad ||
          code === 0x061c ||
          code === 0x180e ||
          (code >= 0x200b && code <= 0x200f) ||
          (code >= 0x2028 && code <= 0x2029) ||
          (code >= 0x202a && code <= 0x202e) ||
          (code >= 0x2060 && code <= 0x2064) ||
          (code >= 0x2066 && code <= 0x2069) ||
          (code >= 0xd800 && code <= 0xdfff) ||
          code === 0xfeff ||
          (code >= 0xe0000 && code <= 0xe007f)
        ) {
          continue
        }
        chars.push(ch)
      }
      return chars.join("")
    }
    // Put a banner on screen for a download the runtime is holding.
    function showDownloadBanner(node, downloadId, filename) {
      if (globalDownloads[downloadId]) {
        return
      }
      const label = safeLabel(RED.utils.getNodeLabel(node, node.type))
      const name = safeLabel(filename)
      const container = RED.nodes.workspace(node.z) || RED.nodes.subflow(node.z)
      const flow = container ? safeLabel(container.label || container.name) : ""
      const key = `downloadfile.info.download_ready${flow ? "_flow" : ""}${
        name ? "" : "_noname"
      }`
      const text = node._(key, { node: label, flow, filename: name })
      const entry = {
        node,
        // The name the runtime already sanitised, offered in the save dialog.
        filename: typeof filename === "string" ? filename : "",
        notification: null,
        timer: null,
        claiming: false,
        // `true` while the save dialog is open.
        picking: false,
      }
      globalDownloads[downloadId] = entry
      entry.timer = window.setTimeout(function () {
        clearDownload(downloadId, false)
      }, globalDownloadExpiryMs)
      entry.notification = RED.notify(notifyText(text), {
        fixed: true,
        buttons: [
          {
            text: node._("downloadfile.info.download_button"),
            class: "primary",
            click: function () {
              startDownload(downloadId)
            },
          },
          {
            text: node._("downloadfile.info.download_dismiss"),
            click: function () {
              clearDownload(downloadId, true)
            },
          },
        ],
      })
    }
    // Extensions the save dialog gets a file type for, and that type. The same
    // extensions the runtime's contentTypeFor() names a type for. Any other
    // extension gets no `types` entry, because the dialog throws a TypeError on
    // an extension or a type it does not accept. Object.create(null), so an
    // extension such as ".constructor" finds nothing.
    const globalPickerTypes = Object.assign(Object.create(null), {
      csv: "text/csv",
      json: "application/json",
      log: "text/plain",
      txt: "text/plain",
    })
    // Can this browser show a save dialog? The File System Access API exists in
    // Chrome and Microsoft Edge, and only in a secure context (https, or
    // localhost).
    function canPickFile() {
      return (
        window.isSecureContext === true &&
        typeof window.showSaveFilePicker === "function"
      )
    }
    // The save dialog's options: the name the runtime will send, and a file type
    // when the extension is one of globalPickerTypes.
    function pickerOptions(proposed) {
      const options = {}
      // The same filter as the banner, so the dialog and the banner show the
      // same name even when something other than the runtime sent the event.
      const filename = stripHidden(proposed)
      if (!filename) {
        return options
      }
      options.suggestedName = filename
      const match = /\.([A-Za-z0-9]{1,16})$/.exec(filename)
      const mime = match ? globalPickerTypes[match[1].toLowerCase()] : undefined
      if (mime) {
        const accept = {}
        accept[mime] = [`.${match[1]}`]
        options.types = [{ accept }]
      }
      return options
    }
    // The Download button. When the browser can show a save dialog, it opens
    // first, inside the click: the browser allows it only while the click is
    // fresh, so nothing is awaited before it. Nothing is claimed until a file is
    // chosen, so Cancel in the dialog leaves the banner and the download open.
    // Any other failure of the dialog falls back to the download manager.
    function startDownload(downloadId) {
      const entry = globalDownloads[downloadId]
      if (!entry || entry.claiming || entry.picking) {
        return
      }
      if (!canPickFile()) {
        claimDownload(downloadId, null)
        return
      }
      let picked
      try {
        picked = window.showSaveFilePicker(pickerOptions(entry.filename))
      } catch (_) {
        claimDownload(downloadId, null)
        return
      }
      entry.picking = true
      Promise.resolve(picked).then(
        function (handle) {
          entry.picking = false
          if (globalDownloads[downloadId] !== entry) {
            // Claimed in another editor, expired, or its node deleted while the
            // dialog was open.
            notifyFailure(entry.node, handle, "downloadfile.info.download_gone")
            return
          }
          claimDownload(downloadId, handle || null)
        },
        function (error) {
          entry.picking = false
          if (error && error.name === "AbortError") {
            // The user closed the dialog. The banner stays for another try.
            return
          }
          if (globalDownloads[downloadId] === entry) {
            claimDownload(downloadId, null)
          }
        }
      )
    }
    // Stop a failed write to a chosen file. Aborting the writable makes the
    // browser discard its temporary copy, so the chosen file never gets a short
    // file that looks whole. Cancelling an unread body closes the connection, so
    // the runtime stops the download. Resolves when the abort has settled, so
    // the file is no longer locked by the writable.
    function discardSave(response, writable) {
      const ignore = function () {}
      if (response && response.body && !response.bodyUsed) {
        try {
          response.body.cancel().catch(ignore)
        } catch (_) {}
      }
      if (!writable) {
        return Promise.resolve()
      }
      try {
        return Promise.resolve(writable.abort()).catch(ignore)
      } catch (_) {
        return Promise.resolve()
      }
    }
    // Delete the file the save dialog chose. Chrome creates that file, or
    // empties an existing one, as soon as the dialog closes, so a failed
    // download would leave an empty file behind. handle.remove() exists in
    // Chrome and Microsoft Edge 110 and later. Resolves `true` when the file is
    // gone, `false` when it may still be there.
    function discardChosenFile(handle) {
      if (!handle || typeof handle.remove !== "function") {
        return Promise.resolve(false)
      }
      try {
        return Promise.resolve(handle.remove()).then(
          function () {
            return true
          },
          function () {
            return false
          }
        )
      } catch (_) {
        return Promise.resolve(false)
      }
    }
    // Tell the user that a download did not reach the disk. After the save
    // dialog, delete the chosen file first, and add a sentence when that fails.
    function notifyFailure(node, handle, key, type) {
      if (!handle) {
        RED.notify(notifyText(node._(key)), type)
        return
      }
      const name = safeLabel(handle.name)
      discardChosenFile(handle).then(function (deleted) {
        let text = node._(key, { filename: name })
        if (!deleted) {
          const args = { filename: name }
          const end = /[.!?]$/.test(text) ? "" : "."
          text = `${text}${end} ${node._("downloadfile.info.download_left_empty", args)}`
        }
        RED.notify(notifyText(text), type)
      })
    }
    // Write the download into the file chosen in the save dialog. The body is
    // piped to disk as it arrives and is never held in memory. The runtime ends
    // a failed download by destroying the connection, so the body stream errors,
    // pipeTo() aborts the writable, and the save is reported as failed.
    function saveToFile(node, handle, ticket) {
      const request = adminRequest(
        `node-red-contrib-downloadfile/download/${encodeURIComponent(ticket)}`
      )
      const name = safeLabel(handle.name)
      let response = null
      let writable = null
      // Stays on screen until the save ends: a stream can run for hours.
      const saving = RED.notify(
        notifyText(node._("downloadfile.info.download_saving", { filename: name })),
        { fixed: true }
      )
      const closeSaving = function () {
        try {
          saving.close()
        } catch (_) {}
      }
      fetch(request.url, {
        headers: request.headers,
        cache: "no-store",
        credentials: "same-origin",
        // The route never redirects. A redirect comes from something in front
        // of Node-RED, for example a proxy login page, and must not be written
        // into the file.
        redirect: "error",
      })
        .then(function (answer) {
          response = answer
          if (!answer.ok || !answer.body) {
            throw new Error(`HTTP ${answer.status}`)
          }
          return handle.createWritable()
        })
        .then(function (stream) {
          writable = stream
          return response.body.pipeTo(stream)
        })
        .then(
          function () {
            closeSaving()
            const msg = node._("downloadfile.info.download_saved", {
              filename: name,
            })
            RED.notify(notifyText(msg), "success")
          },
          function () {
            closeSaving()
            discardSave(response, writable).then(function () {
              const key = "downloadfile.info.download_save_failed"
              notifyFailure(node, handle, key, "error")
            })
          }
        )
    }
    // Hand the file to the browser's own download manager, which writes it
    // straight to disk. Used when the browser cannot show a save dialog.
    // Not a fetch() into a Blob: the file can be gigabytes.
    // An anchor with the `download` attribute never navigates the editor tab
    // away, so an error page cannot discard unsaved flow edits. The attribute is
    // empty, so the browser keeps the name the runtime sends.
    function saveDownload(ticket) {
      const request = adminRequest(
        `node-red-contrib-downloadfile/download/${encodeURIComponent(ticket)}`
      )
      const anchor = document.createElement("a")
      anchor.href = request.url
      anchor.download = ""
      anchor.rel = "noopener"
      anchor.style.display = "none"
      // Firefox acts on a synthetic click only for an anchor in the document.
      document.body.appendChild(anchor)
      anchor.click()
      document.body.removeChild(anchor)
    }
    // A Stream mode download raises a runtime event. It must not start the
    // download itself: a download with no user click before it counts against
    // Chrome's per-tab limit. A banner asks for the click instead. Registered
    // here, not in oneditprepare(), because the banner must show whether or not
    // the node's edit dialog is open.
    RED.comms.subscribe("notification/#", function (topic, payload) {
      if (!topic.startsWith(globalStreamSentinel)) {
        return
      }
      const { downloadId, filename, claimed, expired } = payload || {}
      if (typeof downloadId !== "string" || !globalHexIdRe.test(downloadId)) {
        return
      }
      if (claimed || expired) {
        // Somebody took the file, or the runtime stopped holding it.
        clearDownload(downloadId, false)
        return
      }
      // A session that cannot pass the claim's permission check would only be
      // shown a button that fails.
      if (!RED.user.hasPermission("downloadfile.read")) {
        return
      }
      const id = topic.slice(globalStreamSentinel.length).trim()
      const node = RED.nodes.node(id)
      if (!node || node.type !== "downloadfile") {
        return
      }
      showDownloadBanner(node, downloadId, filename)
    })
    // A node deleted while its download is on offer would leave a banner the user
    // can no longer place.
    RED.events.on("nodes:remove", function (node) {
      if (!node || !node.id) {
        return
      }
      Object.keys(globalDownloads).forEach(function (downloadId) {
        if (globalDownloads[downloadId].node.id === node.id) {
          clearDownload(downloadId, false)
        }
      })
    })
    // ---- One file per message (Stream off) -----------------------------------
    RED.comms.subscribe("notification/#", function (topic, payload) {
      if (topic.startsWith("notification/DOWNLOAD-FILE")) {
        const fname = payload.filename || ""
        const data = payload.data || ""
        const encoding = payload.encoding || "utf-8"
        let obj
        const attr = encoding === "base64" ? `${encoding},${data}` : `charset=${encoding},${encodeURIComponent(data)}`
        try {
          obj = document.createElement("a")
          obj.setAttribute("href", `data:text/plain;${attr}`)
          obj.setAttribute("download", fname)
          obj.click()
        } catch (_) { }
        obj && obj.remove()
      }
    })
    RED.nodes.registerType("downloadfile", {
      category: "prescient",
      color: "rgb(74, 179, 255)",
      defaults: {
        name: { value: "" },
        filename: { value: "" },
        encoding: { value: "none" },
        stream: { value: false },
        // Stream mode only: the msg property whose truthy value on the final
        // message fails the download. A config written by hand can lack the key,
        // which stays valid; the runtime then reads msg.error.
        errorProperty: {
          value: "error",
          validate: function (v) {
            if (v === undefined) {
              return true
            }
            return (
              typeof v === "string" &&
              v !== "" &&
              RED.utils.validatePropertyExpression(v)
            )
          },
        },
        // One output in Stream mode, none otherwise. Kept in step with the
        // checkbox by oneditprepare(), through the hidden node-input-outputs.
        outputs: { value: 0 },
      },
      inputs: 1,
      outputs: 0,
      icon: "font-awesome/fa-cloud-download",
      label: function () {
        return this.name || "download file"
      },
      oneditprepare: function () {
        let node = this
        let encSel = $("#node-input-encoding")
        let label = node._("downloadfile.encoding.none")
        $("<option/>", {
          value: "none",
          label: label,
        })
          .text(label)
          .appendTo(encSel)
        let setByMsgLabel = node._("downloadfile.encoding.setbymsg")
        $("<option/>", {
          value: "setbymsg",
          label: setByMsgLabel,
        })
          .text(setByMsgLabel)
          .appendTo(encSel)
        globalEncodings.forEach(function (item) {
          if (Array.isArray(item)) {
            var group = $("<optgroup/>", {
              label: node._(item[0]),
            }).appendTo(encSel)
            for (var i = 1; i < item.length; i++) {
              var enc = item[i]
              $("<option/>", {
                value: enc,
                label: enc,
              })
                .text(enc)
                .appendTo(group)
            }
          } else {
            $("<option/>", {
              value: item,
              label: item,
            })
              .text(item)
              .appendTo(encSel)
          }
        })
        encSel.val(node.encoding)
        // A node saved before Stream mode existed has no errorProperty, and the
        // editor shows it as "". Saved as "", it would fail validation and never
        // fail a download, so show the default instead.
        if (!$("#node-input-errorProperty").val()) {
          $("#node-input-errorProperty").val("error")
        }
        $("#node-input-errorProperty").typedInput({
          default: "msg",
          types: ["msg"],
        })
        // Stream mode writes strings as UTF-8 and ignores the encoding, so the
        // encoding row is hidden while Stream is on. The error property is read
        // in Stream mode only, so its row shows only while Stream is on.
        function updateStream() {
          const streaming = $("#node-input-stream").is(":checked")
          $(".form-row-file-encoding")[streaming ? "hide" : "show"]()
          $(".form-row-error-property")[streaming ? "show" : "hide"]()
          $("#node-input-outputs").val(streaming ? 1 : 0)
        }
        $("#node-input-stream").on("change", updateStream)
        updateStream()
      },
    })
  })()
</script>
